<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Foodie</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f4;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #ff654f;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #ff654f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff4932;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .register a {
            color: #ff654f;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ff654f;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="box">

        <div class="logo">
            🍔 Foodie
        </div>

        <h1>
            Welcome Back!
        </h1>

        <form method="POST">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
