<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ restaurant.name }} - Menu</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f4;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back {
            text-decoration: none;
            color: #ff654f;
            font-weight: bold;
        }

        .cart-button {
            text-decoration: none;
            background: #ff654f;
            color: white;
            padding: 12px 22px;
            border-radius: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #ff654f;
            margin-top: 25px;
        }

        .restaurant-info {
            text-align: center;
            color: #777;
            margin-bottom: 40px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .food-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .food-image {
            height: 160px;
            border-radius: 15px;
            background: #ffe1dc;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 65px;
        }

        .food-card h2 {
            margin-bottom: 8px;
        }

        .food-card p {
            color: #777;
        }

        .price {
            color: #ff654f;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

        .add-button {
            display: block;
            text-align: center;

            background: #ff654f;
            color: white;

            text-decoration: none;
            padding: 12px;
            border-radius: 25px;

            font-weight: bold;
        }

        .add-button:hover {
            background: #ff4932;
        }

        @media (max-width: 800px) {

            .menu-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <div class="top-bar">

        <a href="/restaurants"
           class="back">

            ← Back to Restaurants

        </a>


        <a href="/cart"
           class="cart-button">

            🛒 Cart

        </a>

    </div>


    <h1>
        🍴 {{ restaurant.name }}
    </h1>


    <div class="restaurant-info">

        <p>
            {{ restaurant.description }}
        </p>

        <p>
            📍 {{ restaurant.location }}
        </p>

        <p>
            ⭐ {{ restaurant.rating }}
        </p>

    </div>


    <div class="menu-grid">


        {% for item in restaurant.menu_items %}


        <div class="food-card">


            <div class="food-image">

                🍕🍔

            </div>


            <h2>

                {{ item.name }}

            </h2>


            <p>

                {{ item.description }}

            </p>


            <div class="price">

                ₹{{ item.price }}

            </div>


            <a href="{{ url_for('main.add_to_cart', item_id=item.id) }}"
               class="add-button">

                🛒 Add to Cart

            </a>


        </div>


        {% endfor %}


    </div>

</div>

</body>

</html>
